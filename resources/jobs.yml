resources:
  jobs:
    etl_job:
      name: oidc-demo-etl
      run_as:
        service_principal_name: ${var.etl_sp_app_id}
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: etl
          notebook_task:
            notebook_path: ../src/etl.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"

    reports_job:
      name: oidc-demo-reports
      run_as:
        service_principal_name: ${var.reports_sp_app_id}
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: reports
          notebook_task:
            notebook_path: ../src/reports.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
